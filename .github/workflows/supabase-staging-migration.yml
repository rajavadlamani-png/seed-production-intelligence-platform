name: Supabase staging migration

on:
  workflow_dispatch:
    inputs:
      confirm_staging_project_ref:
        description: "Enter the exact SUPABASE_STAGING_PROJECT_REF value to confirm the target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply-staging-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      CONFIRM_STAGING_PROJECT_REF: ${{ inputs.confirm_staging_project_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Require staging-only secrets and explicit target confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          test -n "$SUPABASE_STAGING_PROJECT_REF" || { echo "Missing SUPABASE_STAGING_PROJECT_REF secret"; exit 1; }
          if [[ "$CONFIRM_STAGING_PROJECT_REF" != "$SUPABASE_STAGING_PROJECT_REF" ]]; then
            echo "Confirmation does not match the configured staging project reference; refusing to deploy."
            exit 1
          fi
          echo "Target confirmation passed for the configured staging project."

      - name: Link only the configured staging project
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations to staging
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list
