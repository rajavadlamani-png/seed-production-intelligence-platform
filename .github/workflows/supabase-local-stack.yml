name: Supabase local-stack migration and contract test

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-stack.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start the actual Supabase local stack
        run: supabase start -x studio,inbucket,imgproxy,analytics,vector

      - name: Rebuild local database from repository migrations
        run: supabase db reset

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify tenant RLS, security helper settings, and Supabase Auth
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/local_stack_contract.sql

      - name: Test tenant and field authorization under real Supabase Auth
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/authorization_local_stack.sql

      - name: Test workflows, storage isolation and trusted onboarding
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operational_transition_smoke.sql

      - name: Stop local stack
        if: always()
        run: supabase stop
