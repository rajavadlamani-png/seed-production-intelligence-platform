name: Crop Monitor syntax check

on:
  push:
    branches:
      - feature/satellite-worker-integration
  pull_request:
    branches:
      - feature/supabase-auth-integration

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check app.js
