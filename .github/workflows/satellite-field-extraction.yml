name: Satellite field extraction audit
on:
  push:
    branches:
      - feature/configurable-paddy-templates
  # Daily check; collect the latest completed fixed five-day crop interval.
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: satellite-field-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configurable-paddy-templates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate extraction script syntax
        run: python -m py_compile scripts/extract_satellite_field_metrics.py
      - name: Test satellite response channel mapping
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Live smoke test existing ANVORA Worker (synthetic polygon; no database writes)
        if: github.event_name == 'push'
        env:
          COPERNICUS_EO_WORKER_URL: https://anvora-eo-connector.raja-vadlamani.workers.dev/api/sentinel1
        run: python scripts/test_anvora_worker_smoke.py
      - name: Verify explicit pilot database write gate
        if: github.event_name != 'push'
        env:
          ALLOW_SATELLITE_DB_WRITES: ${{ secrets.ALLOW_SATELLITE_DB_WRITES }}
          EXPECTED_PILOT_SUPABASE_PROJECT_REF: ${{ secrets.EXPECTED_PILOT_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SEED_WEATHER_SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          allowed = os.environ.get("ALLOW_SATELLITE_DB_WRITES", "").strip().lower() == "true"
          expected = os.environ.get("EXPECTED_PILOT_SUPABASE_PROJECT_REF", "").strip()
          hostname = urlparse(os.environ.get("SUPABASE_URL", "")).hostname or ""
          if not allowed:
              raise SystemExit("Blocked: ALLOW_SATELLITE_DB_WRITES must be explicitly set to true.")
          if not expected or hostname.lower() != (expected + ".supabase.co").lower():
              raise SystemExit("Blocked: SUPABASE_URL host does not match EXPECTED_PILOT_SUPABASE_PROJECT_REF.")
          print("Write gate passed for the explicitly configured pilot project.")
          PY
      - name: Extract Sentinel optical and radar metrics
        if: github.event_name != 'push'
        env:
          SUPABASE_URL: ${{ secrets.SEED_WEATHER_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SEED_WEATHER_SUPABASE_SERVICE_ROLE_KEY }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          COPERNICUS_EO_WORKER_URL: https://anvora-eo-connector.raja-vadlamani.workers.dev/api/sentinel1
          SATELLITE_CADENCE_DAYS: "5"
        run: python scripts/extract_satellite_field_metrics.py
