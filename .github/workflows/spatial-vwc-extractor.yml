name: Spatial VWC extractor checks
on:
  push:
    branches: [main]
    paths:
      - "beta/tools/**"
      - ".github/workflows/spatial-vwc-extractor.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extractor dependencies
        run: python -m pip install -r beta/tools/requirements.txt
      - name: Compile extractor
        run: python -m py_compile beta/tools/sentinel_spatial_extractor.py
      - name: Run offline geometry self-test
        run: python beta/tools/sentinel_spatial_extractor.py --self-test
