name: Frontend contract tests

on:
  push:
    branches:
      - feature/crop-hybrid-masters-readonly
  pull_request:
    branches:
      - main

jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
      - name: Run frontend contract tests
        run: node --test tests/frontend-contract.test.cjs
